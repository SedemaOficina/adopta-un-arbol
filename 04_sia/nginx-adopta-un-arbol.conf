# Guardianes de árboles · https://sedema.sia.cdmx.gob.mx/adopta-un-arbol/   (propuesta para el equipo del SIA, Lote 7)
# Va dentro del bloque server del dominio. Supone que el sitio vive en /srv/sia/adopta-un-arbol, que es un enlace a la
# carpeta de la versión vigente (/srv/sia/adopta-un-arbol-v29, …): publicar o regresar = cambiar el enlace (ver LEEME.md).
# Cambiar /srv/sia y la ruta de encabezados.conf por las del servidor.

# Con la barra final: las rutas del sitio son relativas y sin ella resuelven contra la raíz del dominio
location = /adopta-un-arbol { return 301 /adopta-un-arbol/; }

location ^~ /adopta-un-arbol/ {
    root /srv/sia;
    index index.html;
    try_files $uri $uri/ =404;
    charset utf-8;
    charset_types text/plain text/css application/javascript image/svg+xml;

    # Compresión: al abrir se descargan 3 MB en lugar de 5.5 MB
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # index.html y lo que no lleva versión: el navegador pregunta cada vez y recibe 304 si no cambió
    include /etc/nginx/snippets/adopta-un-arbol-encabezados.conf;   # copia de 04_sia/encabezados.conf
    add_header Cache-Control "no-cache" always;

    # Se piden con ?v=<versión>: pueden guardarse un año (una versión nueva cambia la dirección)
    location ~ ^/adopta-un-arbol/(app\.js|app\.css|textos\.js|datos/[a-z0-9_]+\.txt)$ {
        include /etc/nginx/snippets/adopta-un-arbol-encabezados.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # Librerías y letras (el nombre lleva la versión) e imágenes: 30 días
    location ~ ^/adopta-un-arbol/(vendor|img)/ {
        include /etc/nginx/snippets/adopta-un-arbol-encabezados.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
# Tipos: el mime.types de nginx ya trae woff2 (font/woff2), svg y js; si una versión vieja no trae woff2, agregar
#   font/woff2 woff2;   al bloque types del servidor (no dentro de location: ahí reemplazaría todos los tipos).
