# Encabezados de seguridad de Guardianes de árboles en el SIA (propuesta, Lote 7).
# Un solo lugar: los usan nginx-adopta-un-arbol.conf (include), express-adopta-un-arbol.js (los lee al arrancar)
# y 03_pruebas/produccion.py, que prueba la versión de producción con exactamente estos valores.
#
# Content-Security-Policy: todo sale del propio sitio, salvo la foto de la calle (Street View de Google: el visor en un
# iframe y sus imágenes). 'wasm-unsafe-eval' solo evita un aviso de deck.gl (prueba interna de WebAssembly que ya se
# atrapa); se puede quitar sin que nada deje de funcionar.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob: https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.ggpht.com; font-src 'self'; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La ubicación solo la pide la propia página («Usar mi ubicación»); cámara y micrófono, nunca.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
