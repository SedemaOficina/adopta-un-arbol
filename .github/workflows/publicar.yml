# Publica el sitio de pruebas en GitHub Pages: sube 10_sitio/ tal cual (sin Jekyll) cada vez que cambia en main.
# Requiere, una sola vez: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Queda en https://sedemaoficina.github.io/adopta-un-arbol/ (la liga de prueba de CONFIG.URL_SITIO).
name: Publicar sitio de pruebas

on:
  push:
    branches: [main]
    paths: ['10_sitio/**', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # v30: lo que recomienda GitHub para Pages (no cortar una publicación a la mitad)

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # v30: solo se publica el modo prueba, y sin los archivos para abrir el sitio en la computadora de Liber
      - name: Revisar el sitio
        run: |
          grep -q 'data-modo="prueba"' 10_sitio/index.html || { echo "10_sitio no está en modo prueba"; exit 1; }
          node --check 10_sitio/app.js && node --check 10_sitio/textos.js
          rm -rf _publicar && cp -r 10_sitio _publicar && rm -f _publicar/*.bat _publicar/*.ps1
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _publicar
      - id: despliegue
        uses: actions/deploy-pages@v5
